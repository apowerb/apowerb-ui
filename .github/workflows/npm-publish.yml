name: Publish @apowerb/sdk to npm

# Same shape as the PyPI publication of the other repositories: triggered by a
# release, version derived from the tag, no long-lived secret.
#
# Authentication goes through npm trusted publishing (OIDC): npm verifies the
# request really comes from this repository and this workflow, the way PyPI
# does. It has to be declared once on npmjs.com for the @apowerb/sdk package.
#
# One caveat npm does not share with PyPI: a trusted publisher cannot be
# configured for a package that does not exist yet, so the very first publish
# has to come from a token. Publish a 0.0.0 placeholder by hand, declare the
# trusted publisher, and let this workflow ship every real version after that
# -- so the first version anyone installs already carries an attestation.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (without the leading v)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish the SDK to npm
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: packages/sdk

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs a recent npm: it is npm that knows how to
      # exchange the GitHub OIDC token for a publishing right.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Resolve the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version to publish: $VERSION"

      - name: Align the package version
        run: npm version "${{ steps.version.outputs.value }}" --no-git-tag-version --allow-same-version

      # Check before sending: what ships must carry the files declared in
      # "exports", and above all not the tests.
      - name: Verify the package contents
        run: |
          npm pack --dry-run
          if npm pack --dry-run 2>&1 | grep -q '__tests__'; then
            echo "::error::tests must never be published"
            exit 1
          fi

      - name: Publish
        run: npm publish --provenance --access public
