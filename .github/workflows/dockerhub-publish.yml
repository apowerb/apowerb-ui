name: Publish apowerb-ui to Docker Hub

on:
  workflow_run:
    workflows: ["Publish @apowerb/apowerb-sdk to npm"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (without the leading v)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish the UI image to Docker Hub
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Resolve the version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.event.workflow_run.head_branch }}"
            VERSION="${VERSION#refs/tags/}"
            VERSION="${VERSION#tags/}"
            VERSION="${VERSION#v}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version to publish: $VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: apowerb/apowerb-ui
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.value }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
