name: Publish apowerb-ui to Docker Hub

# Triggered by the release itself, like the npm publication next door -- NOT by
# that publication finishing. Chaining on `workflow_run` looked equivalent and
# was not: on a chained run GitHub reports the *branch* in `head_branch`, never
# the tag, so every release published an image tagged `main` and moved `latest`
# onto it. That is why npm carries 0.1.2, 0.1.3 and 0.1.4 while Docker Hub has
# none of them -- only the manual dispatches ever produced a versioned image.
# The image does not consume the published SDK (it builds it from the workspace
# source), so there was nothing to wait for either.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (without the leading v)"
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: apowerb/apowerb-ui

jobs:
  version:
    name: Resolve the version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Resolve the version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          # Stripped on both paths: the release tag carries the v by convention,
          # and a dispatch has been given it by hand before -- which is how a
          # `v0.1.4` tag ended up on Docker Hub next to plain 0.1.0 and 0.1.1.
          VERSION="${VERSION#v}"

          # Refuse anything that is not a version instead of tagging the image
          # with it. This is the guard the previous shape lacked: it published
          # `main` and moved `latest` onto it, silently, on every release.
          if ! printf %s "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+-]*$'; then
            echo "::error::refusing to publish an image tagged '$VERSION' -- expected a version like 1.2.3"
            exit 1
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version to publish: $VERSION"

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    runs-on: ${{ matrix.runner }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Each runner builds its own architecture natively and pushes an untagged
      # image; the manifest list that carries the tags is assembled below. The
      # emulated arm64 build this replaces usually took minutes, but stalled for
      # 42 minutes without a log line on 0.1.29 (23/09/26) and had to be
      # cancelled by hand; the rerun then took 8.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      # The digest reads `sha256:<hex>`; the file keeps only the hex, which
      # the manifest step prefixes back with `@sha256:`.
      - name: Export the digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          # One artifact per platform: v4 refuses to have two jobs write the
          # same artifact name.
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the UI image to Docker Hub
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.version.outputs.value }}

      # The tags only ever move once both architectures exist, so a half-built
      # release cannot leave `latest` pointing at a single-arch image.
      - name: Create the manifest list
        shell: bash
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect the published image
        shell: bash
        run: |
          docker buildx imagetools inspect "${{ env.IMAGE }}:${{ needs.version.outputs.value }}"
