name: Publish apowerb-ui to Docker Hub

# Triggered by the release itself, like the npm publication next door -- NOT by
# that publication finishing. Chaining on `workflow_run` looked equivalent and
# was not: on a chained run GitHub reports the *branch* in `head_branch`, never
# the tag, so every release published an image tagged `main` and moved `latest`
# onto it. That is why npm carries 0.1.2, 0.1.3 and 0.1.4 while Docker Hub has
# none of them -- only the manual dispatches ever produced a versioned image.
# The image does not consume the published SDK (it builds it from the workspace
# source), so there was nothing to wait for either.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (without the leading v)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish the UI image to Docker Hub
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Resolve the version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          # Stripped on both paths: the release tag carries the v by convention,
          # and a dispatch has been given it by hand before -- which is how a
          # `v0.1.4` tag ended up on Docker Hub next to plain 0.1.0 and 0.1.1.
          VERSION="${VERSION#v}"

          # Refuse anything that is not a version instead of tagging the image
          # with it. This is the guard the previous shape lacked: it published
          # `main` and moved `latest` onto it, silently, on every release.
          if ! printf %s "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+-]*$'; then
            echo "::error::refusing to publish an image tagged '$VERSION' -- expected a version like 1.2.3"
            exit 1
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version to publish: $VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: apowerb/apowerb-ui
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.value }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Same two platforms as the backend image: without this the build is
          # native to the runner only, and the published image cannot run on an
          # arm64 machine -- which is what every Apple Silicon laptop is.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
