name: CI

# This repository published images and packages without ever running its own
# 69 test files. Two dependency bumps and a navigation rename went through on
# CodeQL alone, which reads the code but never executes it.
#
# Deliberately not filtered by `paths`: a workflow that skips itself is worse
# than none, because a green tick then means "nothing ran" and reads exactly
# like "everything passed". The suite takes minutes; correctness of the signal
# is worth more than those minutes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # `npm ci` and not `npm install`: it fails when package-lock.json has
      # drifted from package.json instead of quietly repairing it. That drift
      # is exactly what kept this repository from being installable for days.
      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx vitest run

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # A passing suite does not prove the app compiles: the tests mock what
      # the build resolves for real. The published image is built from this
      # same command, so a break here is a break in what users install.
      - name: Build the app
        run: npm run build
        env:
          # The build must not read a deployment's configuration. Anything
          # required at build time and absent here would be a bug in the app,
          # not in this workflow.
          NEXT_TELEMETRY_DISABLED: '1'

  lint:
    name: Identifiants libres (no-undef)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `eslint-config-next` n'active PAS `no-undef`. Le 08/09, un correctif de
      # sécurité a laissé deux appels à une fonction supprimée, dont un dans
      # l'effet joué à l'ouverture du modal de planification : écran rouge dès
      # l'ouverture, et ni le lint, ni les tests, ni le build n'ont bronché.
      #
      # Ce pas ne branche PAS le lint entier : `npx eslint src` rend 61 erreurs
      # de dette existante sur `main`. Il les compte et les affiche, et n'échoue
      # que sur un identifiant libre. Voir l'en-tête du script.
      - name: Aucun identifiant libre sous src/
        run: node .github/scripts/lint-no-undef.mjs
